<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>五线谱信纸 - 用音乐书写你的信件</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎵五线谱信纸</h1>
            <p class="subtitle">在五线谱上书写你的中文信件，让文字化作音符</p>
        </header>

        <div class="main-content">
            <aside class="control-panel">
                <div class="control-group">
                    <label for="letterTitle">信件标题</label>
                    <input type="text" id="letterTitle" placeholder="给你的信" value="给你的信">
                </div>

                <div class="control-group">
                    <label for="letterContent">信件内容</label>
                    <textarea id="letterContent" placeholder="在这里写下你想说的话...">静怡，

你好！做梦也想不到我把信写到五线谱上吧？五线谱是偶然来的，你也是偶然来的。不过我给你的信值得写在五线谱里呢。但愿我和你，是一支唱不完的歌。

谁也管不住我爱你，真的，谁管谁就真傻，我和你谁都管不住呢。你别怕，真的你谁也不要怕，最亲爱的好静怡，要爱就爱个够吧，世界上没有比爱情更好的东西了。爱一回就够了，可以死了。什么也不需要了。这话傻不傻？我觉得我的话不能孤孤单单地写在这里，你要把你的信写在空白的地方。这可不是海誓山盟。海誓山盟是把现在的东西固定住。两个人都成了活化石。我们用不着它。我们要爱情长久。真的，它要长久我们就老在一块，不分开。你明白吗？你，你，真的，和你在一起就只知道有你了，没有我，有你，多快活！

我现在一想起有人写的爱情小说就觉得可怕极了。我决心不写爱情了。你看过缪塞的《提香的儿子》吗？提香的儿子给爱人画了一幅肖像，以后终身不作画了，他把画笔给了爱了。他做得对。噢，真的，我们为什么不早认识？那样我们到现在就已经爱了好多年。多么可惜啊！爱才没够呢。

傻子才以为过家家才是爱情呢，世俗的心理真可怕。不听他们的，不听。不管天翻地覆也好，昏天黑地也好，我们到一起来寻找安谧。我觉得我提起笔来冥想的时候，还有坐在你面前的时候，都到了人所不知的世界。世界没有这个哪成呢？过去是没有它就活得没意思，现在没有你也没意思。</textarea>
                </div>

                <div class="control-row">
                    <div class="control-group half">
                        <label for="fontSize">字号</label>
                        <input type="range" id="fontSize" min="14" max="36" value="22">
                        <span id="fontSizeValue">22px</span>
                    </div>
                    <div class="control-group half">
                        <label for="lineHeight">行间距</label>
                        <input type="range" id="lineHeight" min="50" max="120" value="80">
                        <span id="lineHeightValue">80px</span>
                    </div>
                </div>

                <div class="control-row">
                    <div class="control-group half">
                        <label for="textColor">文字颜色</label>
                        <input type="color" id="textColor" value="#000000">
                    </div>
                    <div class="control-group half">
                        <label for="staffColor">五线谱颜色</label>
                        <input type="color" id="staffColor" value="#3366cc">
                    </div>
                </div>

                <div class="control-group">
                    <label for="fontFamily">字体</label>
                    <select id="fontFamily">
                        <option value="'Ma Shan Zheng', 'KaiTi', '楷体', serif">楷体 (手写风)</option>
                        <option value="'ZCOOL XiaoWei', 'SimSun', '宋体', serif">宋体 (典雅)</option>
                        <option value="'Noto Serif SC', 'SimHei', '黑体', sans-serif">黑体 (现代)</option>
                        <option value="'STXingkai', 'Xingkai SC', '行楷', cursive">行楷 (飘逸)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>信件排版</label>
                    <div class="mode-toggle">
                        <label class="mode-option">
                            <input type="radio" name="letterMode" value="single" checked>
                            <span>📜 单页长信</span>
                        </label>
                        <label class="mode-option">
                            <input type="radio" name="letterMode" value="multi">
                            <span>📄 多页信件</span>
                        </label>
                    </div>
                    <p class="mode-hint" id="modeHint">所有内容合并为一张纵向长信纸</p>
                </div>

                <div class="control-group">
                    <label>装饰选项</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="showClef" checked>
                            <span>显示谱号</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="showNotes" checked>
                            <span>文字间显示音符</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="showBorder" checked>
                            <span>显示信纸边框</span>
                        </label>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" id="renderBtn">🎨 重新绘制</button>
                    <button class="btn btn-success" id="exportBtn">💾 导出图片</button>
                    <button class="btn btn-secondary" id="resetBtn">↺ 重置</button>
                </div>
            </aside>

            <main class="canvas-container">
                <div class="canvas-wrapper">
                    <div class="pages-container" id="pagesContainer"></div>
                </div>
            </main>
        </div>
    </div>

    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <script src="abcjs-basic-min.js"></script>
    <div id="__abcjs_clef_extractor__" style="position:absolute;left:-99999px;top:-99999px;visibility:hidden;"></div>
    <script src="script.js"></script>
</body>
</html>
