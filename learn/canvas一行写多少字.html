<html>
  <head>
    <script type="application/javascript">
 
function draw() {

function getLineTextAndCount(ctx, text, maxWidth) {
    let measuredWidth = 0;
    let charCount = 0;
    let lineText = "";

    for (let i = 0; i < text.length; i++) {
        const char = text[i];
        // 1. 模拟加上当前字符后的总宽度
        const nextWidth = ctx.measureText(lineText + char).width;
        
        // 2. 如果超过了最大宽度，则停止
        if (nextWidth > maxWidth) {
            break;
        }
        
        lineText += char;
        charCount++;
    }

    return {
        charCount: charCount, // 这一行能容纳的字数
        text: lineText        // 这一行实际显示的文字
    };
}

 const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// 必须先设置字体，否则测量不准
ctx.font = "16px Arial"; 

const longText = `这是一段很长的文字，用来测试在特定的画布宽度下，测试一行到底能够容纳多少个字。测试一行到底能够容纳多少个字。
测试一行到底能够容纳多少个字。测试一行到底能够容纳多少个字。测试一行到底能够容纳多少个字。测试一行到底能够容纳多少个字。`;
const maxWidth = canvas.width;  

const result = getLineTextAndCount(ctx, longText, maxWidth);
console.log(`一行的宽度是 ${canvas.width}`);
console.log(`一行能写 ${result.charCount} 个字，内容为: ${result.text}`);


// 3. 渲染到画布上
ctx.fillText(result.text, 0, 50);



}
    </script>
  </head>
  <body onload="draw();">
    <canvas id="canvas" width="800" height="800"></canvas>
  </body>
</html>
