<html>
  <head>

<style>
        /* 清除默认边距，防止出现滚动条 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* 让 canvas 以块级元素占满窗口 */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>

  </head>
  <body onload="draw();">
    <canvas id="canvas"   ></canvas>

<script type="application/javascript">

// window.addEventListener('resize', draw());

function draw() {

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
   

    var width = window.innerWidth
    var height = window.innerHeight;
    console.log("浏览器宽度"+width)
    console.log("浏览器高度"+height)

    // 一页11行
    var lines = 11
    // var width = window.screen.width
    // var height =  window.screen.height

    canvas.width = width
    canvas.height = height

    var left = 0
    var right = width
    

    var spacing  =  Math.floor( (height)/lines/8 )
    var y = spacing/8
    var color = '#000000';



    var size = Math.floor(height/(spacing*4))

    var number = (size/2) ;;
    if(size%2==1){
      number = (size/2) +1;
    }
    else{
        number = (size/2) ;
    }
    
    for(let i = 0;i< lines;i++){
          var space = spacing * i * 8
          drawSingleStaff(ctx,left,right,10+y+space,spacing,color)
    }

    const text = "亲爱的朋友：\n\n\n   见字如面。愿这封信抵达时，你一切安好。";
    var fontsize = spacing * 5
  
    ctx.font = fontsize+"px serif";
    console.log( ctx.font )
  
    // ctx.fillText(text.substring(0,index+1), 10, 50)

    // for(let i = 0;i< number;i++){
    //     var space = spacing* i * 8
    //    ctx.fillText(text, 10, 50+space)
    // }

    
    let index = 0;
    let line = 0  
    let line_index = 0
    typeWriter()
    function typeWriter() {
      if(index < text.length){
        if( text.substring(index,index+1)=='\n'){
          line++
          console.log(line)
          line_index = index+1
          index++
        }
        
        ctx.fillText(text.substring(line_index,index+1), 10, spacing*5+  spacing*4*line)  
        index++;
        setTimeout(typeWriter, 100);
      }
    }

}
  


  function  drawSingleStaff(ctx,left, right, y, spacing, color) {
        ctx.strokeStyle = color;
        ctx.globalAlpha = 1;
        for (let i = 0; i < 5; i++) {
            const lineY = y + i * spacing;
            ctx.beginPath();
            ctx.moveTo(left, lineY);
            ctx.lineTo(right, lineY);
            ctx.stroke();
        }
            // ctx.beginPath();
            // ctx.moveTo(left, y);
            // ctx.lineTo(left, y+4*spacing);
            // ctx.moveTo(right, y);
            // ctx.lineTo(right, y+4*spacing);
            // ctx.stroke();
    }

    window.addEventListener('resize', draw());
    </script>
    
  </body>
