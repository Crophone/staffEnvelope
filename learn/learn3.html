<html>
  <head>
    <script type="application/javascript">
function draw() {
  var canvas = document.getElementById("canvas");
  if (canvas.getContext) {
    var ctx = canvas.getContext("2d");

    ctx.beginPath();
    ctx.moveTo(75, 50);
    ctx.lineTo(100, 75);
    ctx.lineTo(100, 25);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(50,50);
    ctx.lineTo(100, 75);
    ctx.lineTo(0, 75);
    ctx.fill();

  }
}
    
    </script>
  </head>
  <body onload="draw();">
    <canvas id="canvas" width="200" height="200"></canvas>
  </body>
</html>
